<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operational context — workspace</title>
<style>
/* ─────────────────────────────────────────────────────────────
   Tokens.
   No web fonts on purpose: this runs on locked-down corporate
   laptops with no CDN egress. System stacks only.
   ───────────────────────────────────────────────────────────── */
:root{
  --ground:#E4E6E1;
  --surface:#F2F3F0;
  --surface-sunk:#DADCD6;
  --ink:#1B2430;
  --muted:#6B7580;
  --rule:#C3C7C1;
  --accent:#24435F;

  --breach:#A8322D;
  --warn:#B0761A;
  --ok:#3F7A5C;
  --unknown:#8A8F86;

  --sans: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", "SF Mono", Consolas, monospace;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1440px;margin:0 auto;padding:var(--s5) var(--s5) var(--s6)}

/* ── Verdict bar ─────────────────────────────────────────── */
.verdict{
  background:var(--surface);
  border:1px solid var(--rule);
  border-left:4px solid var(--verdict-color,var(--unknown));
  padding:var(--s4) var(--s5);
  display:grid;
  grid-template-columns:1fr auto;
  gap:var(--s4);
  align-items:start;
}
.verdict h1{
  margin:0 0 var(--s1);
  font-size:26px;
  font-weight:600;
  letter-spacing:-0.015em;
}
.verdict h1 .repo{font-family:var(--mono);font-weight:500}
.verdict .headline{
  font-size:17px;
  font-weight:500;
  color:var(--verdict-color,var(--ink));
  margin:var(--s3) 0 0;
}
.verdict .sub{color:var(--muted);font-size:13px}
.gitline{
  font-family:var(--mono);font-size:12.5px;color:var(--muted);
  margin-top:var(--s2);
}
.gitline .drift{color:var(--warn);font-weight:600}

/* connector chips */
.connectors{display:flex;flex-direction:column;gap:var(--s2);min-width:230px}
.chip{
  display:grid;grid-template-columns:9px 1fr auto;gap:var(--s2);
  align-items:center;
  font-size:12px;
  padding:var(--s1) var(--s2);
  background:var(--ground);
  border:1px solid var(--rule);
}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--unknown)}
.chip[data-health="ok"] .dot{background:var(--ok)}
.chip[data-health="degraded"] .dot{background:var(--warn)}
.chip[data-health="down"] .dot{background:var(--breach)}
.chip .age{font-family:var(--mono);color:var(--muted);font-size:11.5px}
.chip[data-stale="true"] .age{color:var(--warn);font-weight:600}

/* ── Section frame ───────────────────────────────────────── */
.section{margin-top:var(--s5)}
.section > header{
  display:flex;align-items:baseline;gap:var(--s3);
  padding-bottom:var(--s2);
  border-bottom:1px solid var(--rule);
  margin-bottom:var(--s3);
}
.section > header h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-0.005em}
.section > header .note{color:var(--muted);font-size:12.5px;margin-left:auto;font-family:var(--mono)}

/* ── Change correlation ──────────────────────────────────── */
.change{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);
}
.change > div{background:var(--surface);padding:var(--s3) var(--s4)}
.change .k{font-size:12px;color:var(--muted)}
.change .v{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-0.02em;margin-top:2px}
.change .v.up{color:var(--breach)}
.change .v.down{color:var(--ok)}
.change .cx{font-size:11.5px;color:var(--muted);font-family:var(--mono)}

/* ── Two column body ─────────────────────────────────────── */
.body{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:var(--s5);margin-top:var(--s5)}
@media(max-width:1040px){.body{grid-template-columns:1fr}}

/* ── Service spine ───────────────────────────────────────── */
.svc{border:1px solid var(--rule);background:var(--surface);margin-bottom:var(--s3)}
.svc[data-sev="breach"]{border-left:4px solid var(--breach)}
.svc[data-sev="warn"]{border-left:4px solid var(--warn)}
.svc[data-sev="ok"]{border-left:4px solid var(--ok)}
.svc[data-sev="unknown"]{border-left:4px solid var(--unknown)}

.svc-head{
  width:100%;background:none;border:0;text-align:left;
  display:grid;grid-template-columns:14px minmax(0,1.4fr) repeat(4,minmax(0,1fr)) 92px;
  gap:var(--s3);align-items:center;
  padding:var(--s3) var(--s4);
}
.svc-head:hover{background:var(--surface-sunk)}
.caret{font-family:var(--mono);color:var(--muted);font-size:11px}
.svc-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.svc-name small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;font-family:var(--mono)}

.sig{min-width:0}
.sig .lbl{font-size:10.5px;color:var(--muted)}
.sig .val{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-0.02em;display:flex;align-items:baseline;gap:6px}
.sig .val u{text-decoration:none;font-size:10.5px;font-weight:400;color:var(--muted)}
.sig .val.breach{color:var(--breach)}
.sig .val.warn{color:var(--warn)}
.sig .val.unknown{color:var(--unknown);font-style:italic}
.spark{display:block;margin-top:2px}

.budget{text-align:right}
.budget .bar{height:5px;background:var(--surface-sunk);position:relative;margin-top:4px}
.budget .bar i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.budget[data-sev="warn"] .bar i{background:var(--warn)}
.budget[data-sev="breach"] .bar i{background:var(--breach)}
.budget .val{font-family:var(--mono);font-size:13px;font-weight:600}

.svc-body{border-top:1px solid var(--rule);padding:var(--s3) var(--s4) var(--s4)}
.svc-body[hidden]{display:none}

/* entity ledger */
table.ledger{width:100%;border-collapse:collapse;font-size:12.5px}
table.ledger th{
  text-align:left;font-weight:600;font-size:11px;color:var(--muted);
  padding:0 var(--s2) var(--s2);border-bottom:1px solid var(--rule);
}
table.ledger th.num,table.ledger td.num{text-align:right}
table.ledger td{padding:6px var(--s2);border-bottom:1px solid var(--surface-sunk);vertical-align:top}
table.ledger tr:last-child td{border-bottom:0}
table.ledger .eid{font-family:var(--mono);font-size:11px;color:var(--muted);display:block}
table.ledger .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kind{
  font-size:10px;padding:1px 5px;border:1px solid var(--rule);
  color:var(--muted);background:var(--ground);white-space:nowrap;
}
.state{font-weight:600}
.state.breach{color:var(--breach)}
.state.warn{color:var(--warn)}
.state.ok{color:var(--ok)}
.state.unknown{color:var(--unknown);font-style:italic;font-weight:400}
.ghost{opacity:.55}
.ghost .flag{color:var(--warn);font-weight:600}

/* ── Incident lane ───────────────────────────────────────── */
.inc{
  display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--rule);border-left:4px solid var(--rule);
  padding:var(--s3);margin-bottom:var(--s2);
}
.inc:hover{background:var(--surface-sunk)}
.inc[data-p="1"],.inc[data-p="2"]{border-left-color:var(--breach)}
.inc[data-p="3"]{border-left-color:var(--warn)}
.inc-top{display:flex;gap:var(--s2);align-items:baseline;font-family:var(--mono);font-size:12px}
.inc-top .num{font-weight:600}
.inc-top .age{margin-left:auto;color:var(--muted)}
.inc-top .age.hot{color:var(--breach);font-weight:600}
.inc .desc{margin-top:4px;font-size:13px;line-height:1.35}
.inc .meta{margin-top:var(--s2);font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.inc .ci{color:var(--accent);font-weight:600}

/* ── Reconciliation ──────────────────────────────────────── */
.recon{border:1px solid var(--rule);background:var(--surface)}
.recon-row{display:grid;grid-template-columns:auto 1fr;gap:var(--s3);padding:var(--s3);border-bottom:1px solid var(--surface-sunk)}
.recon-row:last-child{border-bottom:0}
.recon-row .n{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1;min-width:28px}
.recon-row .n.bad{color:var(--breach)}
.recon-row .n.warn{color:var(--warn)}
.recon-row .n.good{color:var(--ok)}
.recon-row .t{font-size:12.5px}
.recon-row .t em{display:block;color:var(--muted);font-style:normal;font-size:11.5px;margin-top:2px;font-family:var(--mono)}

/* ── Query shelf ─────────────────────────────────────────── */
.queries{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:var(--s3)}
.q{border:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column}
.q-head{padding:var(--s3);border-bottom:1px solid var(--rule)}
.q-head .name{font-weight:600;font-size:13px}
.q-head .why{color:var(--muted);font-size:12px;margin-top:2px}
.q-head .idx{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:var(--s2)}
.spl{
  font-family:var(--mono);font-size:11.5px;line-height:1.5;
  background:var(--ground);padding:var(--s3);margin:0;
  white-space:pre-wrap;word-break:break-word;color:var(--ink);
  border-bottom:1px solid var(--rule);flex:1;
}
.q-foot{padding:var(--s2) var(--s3);display:flex;align-items:center;gap:var(--s3)}
.q-foot .last{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:auto}
.btn{
  background:var(--accent);color:#fff;border:1px solid var(--accent);
  padding:5px 12px;font-size:12px;font-weight:600;
}
.btn:hover{background:#1B334A}
.btn[disabled]{opacity:.5;cursor:progress}
.btn.ghost-btn{background:none;color:var(--accent)}
.btn.ghost-btn:hover{background:var(--surface-sunk)}
.q-result{border-top:1px solid var(--rule);padding:var(--s3);font-size:12px}
.q-result[hidden]{display:none}
.q-result table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.q-result th{text-align:left;color:var(--muted);font-weight:600;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.q-result td{padding:3px 0;border-bottom:1px solid var(--surface-sunk)}
.q-result td.num{text-align:right}

/* ── Empty / degraded states ─────────────────────────────── */
.empty{
  border:1px dashed var(--rule);padding:var(--s4);
  color:var(--muted);font-size:13px;background:var(--surface);
}
.empty strong{color:var(--ink);display:block;margin-bottom:2px}
.stale-banner{
  background:#F6EEDA;border:1px solid var(--warn);color:#5C3D06;
  padding:var(--s2) var(--s3);font-size:12.5px;margin-bottom:var(--s3);
}
footer.legal{
  margin-top:var(--s6);padding-top:var(--s3);border-top:1px solid var(--rule);
  color:var(--muted);font-size:11.5px;font-family:var(--mono);
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ══════════ 1. VERDICT ══════════ -->
  <section class="verdict" id="verdict">
    <div>
      <h1>Operational context — <span class="repo" id="v-repo">…</span></h1>
      <div class="sub" id="v-scope">Reading workspace manifest…</div>
      <div class="gitline" id="v-git"></div>
      <p class="headline" id="v-headline">Connecting to observability sources…</p>
    </div>
    <div class="connectors" id="v-connectors"></div>
  </section>

  <!-- ══════════ 2. CHANGE CORRELATION ══════════ -->
  <section class="section">
    <header>
      <h2>Since the last deployment</h2>
      <span class="note" id="deploy-note"></span>
    </header>
    <div class="change" id="change"></div>
  </section>

  <div class="body">
    <!-- ══════════ 3. SERVICE SPINE ══════════ -->
    <div>
      <section class="section" style="margin-top:0">
        <header>
          <h2>Services in this workspace</h2>
          <span class="note">ordered by error-budget burn</span>
        </header>
        <div id="spine"></div>
      </section>

      <!-- ══════════ 5. QUERY SHELF ══════════ -->
      <section class="section">
        <header>
          <h2>Bound Splunk searches</h2>
          <span class="note">run on demand — not polled</span>
        </header>
        <div class="queries" id="queries"></div>
      </section>
    </div>

    <!-- ══════════ 4. INCIDENTS + RECONCILIATION ══════════ -->
    <div>
      <section class="section" style="margin-top:0">
        <header>
          <h2>Open incidents</h2>
          <span class="note" id="inc-note"></span>
        </header>
        <div id="incidents"></div>
      </section>

      <section class="section">
        <header>
          <h2>Manifest reconciliation</h2>
          <span class="note">contract drift</span>
        </header>
        <div class="recon" id="recon"></div>
      </section>
    </div>
  </div>

  <footer class="legal" id="legal"></footer>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   PART 1 — THE MANIFEST
   This is what your kit writes into the checked-out repo. Ship it as
   .opskit/manifest.json and load it here. Nothing below invents an
   entity ID or an index; everything is declared, then verified.
   ═══════════════════════════════════════════════════════════════════ */
const MANIFEST = {
  workspace: "awm-shared-services",
  repo: "awm/position-services",
  branch: "feature/pos-recalc-batching",
  headSha: "9f2c41a",
  servicenow: { assignmentGroup: "AWM-SRE-SharedSvcs", ciClass: "cmdb_ci_service" },
  services: [
    {
      id: "position-aggregator",
      path: "services/position-aggregator",
      slo: { objective: 99.9, window: "28d" },
      dynatrace: [
        { entityId: "SERVICE-8A1C4E2F91B0D3A7", kind: "SERVICE",       name: "position-aggregator" },
        { entityId: "SERVICE-3D9F7B12E60A4C55", kind: "SERVICE",       name: "position-aggregator.batch" },
        { entityId: "PROCESS_GROUP-11C0FF33AA22B",kind:"PROCESS_GROUP", name: "pos-agg jvm" },
        { entityId: "CLOUD_APPLICATION-77BB21EE", kind: "K8S_WORKLOAD", name: "pos-agg deploy" }
      ],
      splunkIndexes: ["awm_pos_prod", "awm_platform_audit"],
      snowCIs: ["CI-POS-AGG-PRD"]
    },
    {
      id: "holdings-api",
      path: "services/holdings-api",
      slo: { objective: 99.95, window: "28d" },
      dynatrace: [
        { entityId: "SERVICE-B4E7A02C13FF98D1", kind: "SERVICE", name: "holdings-api" },
        { entityId: "SERVICE-C0D1E2F3A4B59687", kind: "SERVICE", name: "holdings-api.read" }
      ],
      splunkIndexes: ["awm_hold_prod"],
      snowCIs: ["CI-HOLD-API-PRD"]
    },
    {
      id: "valuation-engine",
      path: "services/valuation-engine",
      slo: { objective: 99.5, window: "28d" },
      dynatrace: [
        { entityId: "SERVICE-5F6A7B8C9D0E1F20", kind: "SERVICE", name: "valuation-engine" },
        { entityId: "HOST-DEADBEEF00112233",   kind: "HOST",    name: "vlt-prd-04" }
      ],
      splunkIndexes: ["awm_val_prod"],
      snowCIs: ["CI-VAL-ENG-PRD"]
    },
    {
      id: "reference-data-sync",
      path: "services/reference-data-sync",
      slo: { objective: 99.0, window: "28d" },
      dynatrace: [
        { entityId: "SERVICE-A1B2C3D4E5F60718", kind: "SERVICE", name: "reference-data-sync" }
      ],
      splunkIndexes: ["awm_refdata_prod"],
      snowCIs: ["CI-REFDATA-PRD"]
    }
  ],
  savedSearches: [
    { id:"q-err-burst", name:"Error burst by endpoint", why:"First stop when the error signal moves. Groups 5xx by route so you know if it is one endpoint or the whole service.",
      index:"awm_pos_prod", earliest:"-60m",
      spl:'index=awm_pos_prod sourcetype=app:json status>=500\n| timechart span=5m count by uri_path limit=8' },
    { id:"q-slow-tx", name:"Slowest transactions", why:"Latency p99 tells you it is slow. This tells you which call is slow.",
      index:"awm_pos_prod", earliest:"-30m",
      spl:'index=awm_pos_prod sourcetype=app:json\n| stats p99(duration_ms) as p99, count by operation\n| sort - p99 | head 15' },
    { id:"q-deploy-diff", name:"Log signature diff across deploy", why:"Surfaces message signatures that appear after the release and did not exist before it.",
      index:"awm_pos_prod", earliest:"-4h",
      spl:'index=awm_pos_prod level IN (ERROR,WARN)\n| eval phase=if(_time>relative_time(now(),"-95m"),"after","before")\n| stats count by phase, log_signature\n| sort - count' },
    { id:"q-batch-lag", name:"Recalc batch lag", why:"The batching change you have open touches this path. Watch the queue depth before and after you push.",
      index:"awm_pos_prod", earliest:"-2h",
      spl:'index=awm_pos_prod component=recalc_batcher\n| timechart span=2m max(queue_depth) as depth, avg(batch_ms) as ms' },
    { id:"q-auth-fail", name:"Downstream auth failures", why:"Entitlement rejections read as client errors and get missed. Split them out.",
      index:"awm_platform_audit", earliest:"-6h",
      spl:'index=awm_platform_audit decision=DENY\n| stats count by principal, resource\n| sort - count | head 20' }
  ]
};

/* ═══════════════════════════════════════════════════════════════════
   PART 2 — THE ADAPTER LAYER  ◀── THIS IS WHERE YOU WIRE THE BACKEND
   Every function returns an Envelope:
     { status:"ok"|"degraded"|"unavailable", fetchedAt:<epoch ms>,
       data:<payload>, reason:<string|null> }

   The envelope is not optional. The whole trust model of this page is
   that a tile can say "I do not know" instead of showing you stale
   green. Never resolve with last-known-good under an "ok" status.

   Replace each mock body with a call to your local MCP bridge
   (a tiny localhost process that holds the tokens — the browser must
   never hold a Dynatrace or ServiceNow credential).
   ═══════════════════════════════════════════════════════════════════ */

const BRIDGE = "http://127.0.0.1:7878";   // your MCP bridge process
const USE_MOCKS = true;                    // flip to false once wired

function envelope(data, status = "ok", reason = null) {
  return { status, fetchedAt: Date.now(), data, reason };
}

async function call(route, body) {
  try {
    const r = await fetch(`${BRIDGE}${route}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!r.ok) return envelope(null, "unavailable", `bridge ${r.status}`);
    const j = await r.json();
    return envelope(j, "ok");
  } catch (e) {
    return envelope(null, "unavailable", "bridge unreachable");
  }
}

const ADAPTERS = {
  /* Dynatrace → metrics:query  (tier A, cheap, poll 30s)
     Ask for the four golden signals per declared entity in ONE call.
     Do not loop per entity — you will hit the API budget. */
  async metrics() {
    if (!USE_MOCKS) return call("/dynatrace/metrics", {
      entities: MANIFEST.services.flatMap(s => s.dynatrace.map(e => e.entityId)),
      metrics: [
        "builtin:service.response.time:percentile(50)",
        "builtin:service.response.time:percentile(95)",
        "builtin:service.response.time:percentile(99)",
        "builtin:service.requestCount.rate",
        "builtin:service.errors.total.rate",
        "builtin:tech.jvm.memory.pool.utilization"
      ],
      from: "now-2h", resolution: "5m"
    });
    return envelope(MOCK.metrics);
  },

  /* Dynatrace → slo:list  (tier A) — burn rate is the ordering key. */
  async slo() {
    if (!USE_MOCKS) return call("/dynatrace/slo", { services: MANIFEST.services.map(s => s.id) });
    return envelope(MOCK.slo);
  },

  /* Dynatrace → entities:list  (tier B, poll 5m)
     Verifies the manifest. Entity IDs rotate on redeploy — this call
     is what turns that silent rot into a visible signal. */
  async entities() {
    if (!USE_MOCKS) return call("/dynatrace/entities", {
      selector: `tag(app:${MANIFEST.workspace})`
    });
    return envelope(MOCK.entities);
  },

  /* Deployment events → Dynatrace events API or your CD system. */
  async deployment() {
    if (!USE_MOCKS) return call("/dynatrace/events", { type: "CUSTOM_DEPLOYMENT", from: "now-24h" });
    return envelope(MOCK.deployment);
  },

  /* ServiceNow → incident table  (tier B, poll 60s)
     Scope by CI, not by assignment group alone, or you will pull the
     whole portfolio into a page about four services. */
  async incidents() {
    if (!USE_MOCKS) return call("/servicenow/incidents", {
      table: "incident",
      query: `active=true^cmdb_ci.nameIN${MANIFEST.services.flatMap(s => s.snowCIs).join(",")}`,
      fields: ["number","priority","state","short_description","cmdb_ci","sys_created_on","assignment_group"]
    });
    return envelope(MOCK.incidents);
  },

  /* Splunk → search  (tier C, ON DEMAND ONLY — never on load)
     Field allowlist belongs on the bridge, server-side. Do not redact
     in the browser; by then the payload has already left the index. */
  async runSearch(q) {
    if (!USE_MOCKS) return call("/splunk/search", {
      spl: q.spl, earliest: q.earliest, latest: "now",
      fieldAllowlist: ["_time","count","uri_path","operation","p99","phase","log_signature","depth","ms","principal","resource"],
      maxRows: 50
    });
    await new Promise(r => setTimeout(r, 700));
    return envelope(MOCK.searchResults[q.id] || { columns: ["result"], rows: [["no rows"]] });
  }
};

/* Freshness thresholds, in seconds. Past `stale`, the tile marks
   itself. Past `dead`, it stops claiming to know anything. */
const FRESHNESS = { metrics:{stale:90,dead:300}, slo:{stale:300,dead:1800},
                    entities:{stale:900,dead:3600}, incidents:{stale:180,dead:600},
                    deployment:{stale:900,dead:3600} };

/* ═══════════════════════════════════════════════════════════════════
   PART 3 — STATE + RENDER
   ═══════════════════════════════════════════════════════════════════ */
const STATE = { metrics:null, slo:null, entities:null, incidents:null, deployment:null, searches:{} };

const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function ageOf(env){ return env ? Math.floor((Date.now() - env.fetchedAt) / 1000) : Infinity; }
function ageText(s){
  if (!isFinite(s)) return "never";
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  return Math.floor(s/3600) + "h ago";
}
function health(key){
  const env = STATE[key], t = FRESHNESS[key];
  if (!env || env.status === "unavailable") return "down";
  const a = ageOf(env);
  if (a > t.dead) return "down";
  if (a > t.stale || env.status === "degraded") return "degraded";
  return "ok";
}
/* A dead source contributes nothing. It must not read as healthy. */
function usable(key){ return health(key) !== "down"; }

function sevOf(burn){
  if (burn == null) return "unknown";
  if (burn >= 2) return "breach";
  if (burn >= 1) return "warn";
  return "ok";
}

function sparkline(points, sev){
  if (!points || points.length < 2) return "";
  const w = 88, h = 18, min = Math.min(...points), max = Math.max(...points), span = (max - min) || 1;
  const d = points.map((p,i) => `${(i/(points.length-1)*w).toFixed(1)},${(h - (p-min)/span*h).toFixed(1)}`).join(" ");
  const stroke = sev === "breach" ? "var(--breach)" : sev === "warn" ? "var(--warn)" : "var(--muted)";
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${d}" fill="none" stroke="${stroke}" stroke-width="1.25" stroke-linejoin="round"/></svg>`;
}

/* ── Verdict ─────────────────────────────────────────────── */
function renderVerdict(){
  $("#v-repo").textContent = MANIFEST.repo;
  $("#v-scope").textContent =
    `${MANIFEST.services.length} services · ${MANIFEST.services.reduce((n,s)=>n+s.dynatrace.length,0)} declared entities · ` +
    `${[...new Set(MANIFEST.services.flatMap(s=>s.splunkIndexes))].length} indexes · queue ${MANIFEST.servicenow.assignmentGroup}`;

  const dep = usable("deployment") ? STATE.deployment.data : null;
  const drift = dep && dep.sha !== MANIFEST.headSha;
  $("#v-git").innerHTML =
    `${esc(MANIFEST.branch)} @ ${esc(MANIFEST.headSha)} · running in prod: ${dep ? esc(dep.sha) : "unknown"}` +
    (drift ? ` <span class="drift">— your branch is ${dep.commitsBehind} commits behind prod</span>` : "");

  // Verdict is derived from the worst service that we can actually see.
  let worst = "unknown", headline = "", color = "var(--unknown)";
  if (usable("slo")) {
    const rows = STATE.slo.data;
    const burning = rows.filter(r => r.burnRate >= 1).sort((a,b) => b.burnRate - a.burnRate);
    if (burning.length) {
      worst = burning[0].burnRate >= 2 ? "breach" : "warn";
      const s = burning[0];
      headline = `${s.service} is burning error budget at ${s.burnRate.toFixed(1)}× — ${s.remaining.toFixed(0)}% of the ${s.window} budget left.`;
    } else {
      worst = "ok";
      headline = "All four services are inside their error budgets.";
    }
  } else {
    headline = "Cannot reach Dynatrace. Health below is unknown, not healthy.";
  }

  const openInc = usable("incidents") ? STATE.incidents.data.filter(i => i.priority <= 2).length : null;
  if (openInc) headline += ` ${openInc} P1/P2 open against these CIs.`;

  color = { breach:"var(--breach)", warn:"var(--warn)", ok:"var(--ok)", unknown:"var(--unknown)" }[worst];
  $("#verdict").style.setProperty("--verdict-color", color);
  $("#v-headline").textContent = headline;

  const c = $("#v-connectors"); c.innerHTML = "";
  [["Dynatrace","metrics"],["ServiceNow","incidents"],["Splunk","splunk"],["Deployments","deployment"]]
    .forEach(([label,key]) => {
      const h = key === "splunk" ? "ok" : health(key);
      const a = key === "splunk" ? "on demand" : ageText(ageOf(STATE[key]));
      const chip = el("div","chip",`<span class="dot"></span><span>${label}</span><span class="age">${a}</span>`);
      chip.dataset.health = h;
      chip.dataset.stale = String(h === "degraded");
      c.appendChild(chip);
    });
}

/* ── Service spine ───────────────────────────────────────── */
const OPEN = new Set(); // expansion state lives in memory only

function renderSpine(){
  const host = $("#spine"); host.innerHTML = "";

  if (!usable("metrics") && !usable("slo")) {
    host.innerHTML = `<div class="empty"><strong>Dynatrace is unreachable</strong>Nothing here is safe to read. Check the bridge process, then your token expiry. The manifest below is still valid — the runtime state is not.</div>`;
    return;
  }
  if (health("metrics") === "degraded") {
    host.appendChild(el("div","stale-banner",
      `Metrics are ${ageText(ageOf(STATE.metrics))} — past the ${FRESHNESS.metrics.stale}s freshness budget. Treat the numbers below as indicative, not current.`));
  }

  const sloBy = {};
  if (usable("slo")) STATE.slo.data.forEach(r => sloBy[r.service] = r);

  const ordered = [...MANIFEST.services].sort((a,b) =>
    ((sloBy[b.id]?.burnRate) ?? -1) - ((sloBy[a.id]?.burnRate) ?? -1));

  ordered.forEach(svc => {
    const slo = sloBy[svc.id];
    const sev = sevOf(slo?.burnRate);
    const m   = usable("metrics") ? STATE.metrics.data[svc.id] : null;

    const card = el("div","svc"); card.dataset.sev = sev;

    const sig = (lbl, val, unit, cls, series) =>
      `<div class="sig"><div class="lbl">${lbl}</div>
        <div class="val ${cls}">${val}${unit?`<u>${unit}</u>`:""}</div>${sparkline(series, cls)}</div>`;

    const unknown = `<span>—</span>`;
    const head = el("button","svc-head");
    head.setAttribute("aria-expanded", String(OPEN.has(svc.id)));
    head.innerHTML =
      `<span class="caret">${OPEN.has(svc.id) ? "▾" : "▸"}</span>
       <span class="svc-name">${esc(svc.id)}<small>${esc(svc.path)}</small></span>
       ${sig("p99 latency", m ? m.p99.at(-1) : unknown, m?"ms":"", m && m.p99.at(-1) > m.p99Baseline*1.3 ? "breach" : m && m.p99.at(-1) > m.p99Baseline*1.1 ? "warn" : (m?"":"unknown"), m?.p99)}
       ${sig("traffic", m ? m.rpm.at(-1).toLocaleString() : unknown, m?"/m":"", m?"":"unknown", m?.rpm)}
       ${sig("errors", m ? (m.errRate.at(-1)*100).toFixed(2) : unknown, m?"%":"", m && m.errRate.at(-1) > 0.02 ? "breach" : m && m.errRate.at(-1) > 0.005 ? "warn" : (m?"":"unknown"), m?.errRate)}
       ${sig("saturation", m ? m.sat.at(-1) : unknown, m?"%":"", m && m.sat.at(-1) > 85 ? "warn" : (m?"":"unknown"), m?.sat)}
       <span class="budget" data-sev="${sev}">
         <span class="val">${slo ? slo.remaining.toFixed(0)+"%" : "—"}</span>
         <span class="bar"><i style="width:${slo ? Math.max(0,Math.min(100,slo.remaining)) : 0}%"></i></span>
         <span class="lbl" style="font-size:10px;color:var(--muted)">${slo ? slo.burnRate.toFixed(1)+"× burn" : "budget unknown"}</span>
       </span>`;

    const body = el("div","svc-body");
    body.hidden = !OPEN.has(svc.id);
    body.innerHTML = renderEntities(svc);

    head.addEventListener("click", () => {
      OPEN.has(svc.id) ? OPEN.delete(svc.id) : OPEN.add(svc.id);
      body.hidden = !OPEN.has(svc.id);
      head.setAttribute("aria-expanded", String(OPEN.has(svc.id)));
      head.querySelector(".caret").textContent = OPEN.has(svc.id) ? "▾" : "▸";
    });

    card.append(head, body);
    host.appendChild(card);
  });
}

function renderEntities(svc){
  const seen = usable("entities") ? STATE.entities.data : null;
  const live = seen ? new Set(seen.map(e => e.entityId)) : null;
  const em   = usable("metrics") ? STATE.metrics.data.__entities || {} : {};

  const rows = svc.dynatrace.map(e => {
    const missing = live && !live.has(e.entityId);
    const d = em[e.entityId];
    const st = missing ? "unknown" : d ? (d.state === "UNHEALTHY" ? "breach" : d.state === "WARNING" ? "warn" : "ok") : "unknown";
    return `<tr class="${missing ? "ghost" : ""}">
      <td>${esc(e.name)}<span class="eid">${esc(e.entityId)}</span></td>
      <td><span class="kind">${esc(e.kind)}</span></td>
      <td class="state ${st}">${missing ? '<span class="flag">not found in Dynatrace</span>' : d ? esc(d.state.toLowerCase()) : "no data"}</td>
      <td class="num">${d ? d.respMs + " ms" : "—"}</td>
      <td class="num">${d ? d.availability.toFixed(2) + "%" : "—"}</td>
      <td class="num">${d ? d.rpm.toLocaleString() : "—"}</td>
    </tr>`;
  }).join("");

  // entities Dynatrace knows about that the manifest never declared
  const declared = new Set(svc.dynatrace.map(e => e.entityId));
  const orphans = (seen || []).filter(e => e.service === svc.id && !declared.has(e.entityId));
  const orphanRows = orphans.map(e => `<tr class="ghost">
      <td>${esc(e.name)}<span class="eid">${esc(e.entityId)}</span></td>
      <td><span class="kind">${esc(e.kind)}</span></td>
      <td class="state warn"><span class="flag">live but undeclared</span></td>
      <td class="num">—</td><td class="num">—</td><td class="num">—</td></tr>`).join("");

  return `<table class="ledger">
    <thead><tr><th>Entity</th><th>Type</th><th>State</th>
      <th class="num">Response</th><th class="num">Availability</th><th class="num">Req/min</th></tr></thead>
    <tbody>${rows}${orphanRows}</tbody></table>
    <div style="margin-top:12px;font-family:var(--mono);font-size:11.5px;color:var(--muted)">
      indexes: ${svc.splunkIndexes.map(esc).join("  ")} &nbsp;·&nbsp; CI: ${svc.snowCIs.map(esc).join(", ")}
      &nbsp;·&nbsp; SLO ${svc.slo.objective}% / ${svc.slo.window}
    </div>`;
}

/* ── Incidents ───────────────────────────────────────────── */
function renderIncidents(){
  const host = $("#incidents"); host.innerHTML = "";
  if (!usable("incidents")) {
    $("#inc-note").textContent = "";
    host.innerHTML = `<div class="empty"><strong>ServiceNow is unreachable</strong>There may be open incidents against these CIs. Check the queue directly before you deploy.</div>`;
    return;
  }
  const list = STATE.incidents.data;
  $("#inc-note").textContent = `${list.length} open`;
  if (!list.length) {
    host.innerHTML = `<div class="empty"><strong>Queue is clear</strong>No active incidents against the four CIs in this workspace.</div>`;
    return;
  }
  list.sort((a,b) => a.priority - b.priority || a.createdAt - b.createdAt).forEach(i => {
    const mins = Math.floor((Date.now() - i.createdAt) / 60000);
    const hot = i.priority <= 2 && mins > 30;
    const b = el("button","inc");
    b.dataset.p = i.priority;
    b.innerHTML = `<div class="inc-top">
        <span class="num">${esc(i.number)}</span><span>P${i.priority}</span><span>${esc(i.state)}</span>
        <span class="age ${hot?"hot":""}">${mins < 60 ? mins+"m" : Math.floor(mins/60)+"h "+(mins%60)+"m"}</span>
      </div>
      <div class="desc">${esc(i.shortDescription)}</div>
      <div class="meta"><span class="ci">${esc(i.ci)}</span> → ${esc(i.service)} · ${esc(i.assignmentGroup)}</div>`;
    b.addEventListener("click", () => {
      OPEN.add(i.service); renderSpine();
      document.querySelector(`.svc[data-sev] .svc-name`) && renderSpine();
      window.open(`https://your-instance.service-now.com/nav_to.do?uri=incident.do?sysparm_query=number=${i.number}`, "_blank", "noopener");
    });
    host.appendChild(b);
  });
}

/* ── Reconciliation ──────────────────────────────────────── */
function renderRecon(){
  const host = $("#recon"); host.innerHTML = "";
  if (!usable("entities")) {
    host.innerHTML = `<div class="empty" style="border:0"><strong>Cannot verify the manifest</strong>Without the entity list, you are trusting IDs that rotate on every redeploy.</div>`;
    return;
  }
  const live = new Set(STATE.entities.data.map(e => e.entityId));
  const declared = MANIFEST.services.flatMap(s => s.dynatrace.map(e => e.entityId));
  const missing = declared.filter(id => !live.has(id));
  const undeclared = STATE.entities.data.filter(e => !declared.includes(e.entityId));
  const noQueries = MANIFEST.services.filter(s =>
    !MANIFEST.savedSearches.some(q => s.splunkIndexes.includes(q.index)));

  const row = (n, cls, title, sub) =>
    `<div class="recon-row"><span class="n ${cls}">${n}</span>
      <span class="t">${title}<em>${sub}</em></span></div>`;

  host.innerHTML =
    row(missing.length, missing.length ? "bad" : "good",
        missing.length ? "declared entities no longer exist" : "every declared entity resolves",
        missing.length ? missing.slice(0,3).join("  ") + (missing.length>3 ? "  +"+(missing.length-3) : "") : "manifest matches Dynatrace") +
    row(undeclared.length, undeclared.length ? "warn" : "good",
        undeclared.length ? "live entities the manifest never declared" : "no undeclared entities",
        undeclared.length ? undeclared.slice(0,2).map(e=>e.name).join("  ") : "coverage is complete") +
    row(noQueries.length, noQueries.length ? "warn" : "good",
        noQueries.length ? "services with no bound search" : "every service has a bound search",
        noQueries.length ? noQueries.map(s=>s.id).join("  ") : "triage path exists everywhere");
}

/* ── Query shelf ─────────────────────────────────────────── */
function renderQueries(){
  const host = $("#queries"); host.innerHTML = "";
  MANIFEST.savedSearches.forEach(q => {
    const res = STATE.searches[q.id];
    const card = el("div","q");
    card.innerHTML =
      `<div class="q-head">
         <div class="name">${esc(q.name)}</div>
         <div class="why">${esc(q.why)}</div>
         <div class="idx">${esc(q.index)} · ${esc(q.earliest)} → now</div>
       </div>
       <pre class="spl">${esc(q.spl)}</pre>
       <div class="q-foot">
         <span class="last">${res ? "ran " + ageText(ageOf(res)) : "not run"}</span>
         <button class="btn ghost-btn" data-copy="${q.id}">Copy SPL</button>
         <button class="btn" data-run="${q.id}">Run search</button>
       </div>
       <div class="q-result" ${res ? "" : "hidden"}>${res ? resultTable(res) : ""}</div>`;

    card.querySelector("[data-run]").addEventListener("click", async ev => {
      const btn = ev.currentTarget; btn.disabled = true; btn.textContent = "Running…";
      STATE.searches[q.id] = await ADAPTERS.runSearch(q);
      renderQueries();
    });
    card.querySelector("[data-copy]").addEventListener("click", ev => {
      navigator.clipboard?.writeText(q.spl);
      ev.currentTarget.textContent = "Copied";
      setTimeout(() => { ev.currentTarget.textContent = "Copy SPL"; }, 1200);
    });
    host.appendChild(card);
  });
}

function resultTable(env){
  if (env.status !== "ok" || !env.data)
    return `<div style="color:var(--breach)">Search failed: ${esc(env.reason || "unknown")}. The index may be restricted for your role.</div>`;
  const { columns, rows } = env.data;
  if (!rows.length) return `<div style="color:var(--muted)">No events in this window. That is a result, not an error.</div>`;
  return `<table><thead><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.slice(0,8).map(r=>`<tr>${r.map((v,i)=>
      `<td class="${typeof v === "number" ? "num" : ""}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    ${rows.length>8 ? `<div style="margin-top:6px;color:var(--muted);font-size:11px">${rows.length-8} more rows — open in Splunk for the full set</div>` : ""}`;
}

/* ── Orchestration: three refresh tiers ──────────────────── */
async function tierA(){ // cheap, 30s
  [STATE.metrics, STATE.slo] = await Promise.all([ADAPTERS.metrics(), ADAPTERS.slo()]);
  renderVerdict(); renderSpine();
}
async function tierB(){ // medium, 60s
  [STATE.incidents, STATE.deployment] = await Promise.all([ADAPTERS.incidents(), ADAPTERS.deployment()]);
  renderVerdict(); renderChange(); renderIncidents();
}
async function tierBSlow(){ // 5m
  STATE.entities = await ADAPTERS.entities();
  renderSpine(); renderRecon();
}

async function boot(){
  renderQueries();
  await Promise.all([tierA(), tierB(), tierBSlow()]);
  $("#legal").textContent =
    `Read-only. Credentials stay in the local bridge at ${BRIDGE}; this page holds none. ` +
    `Log fields are allowlisted server-side. Refresh tiers: metrics 30s · incidents 60s · entities 5m · searches on demand.`;

  setInterval(tierA, 30_000);
  setInterval(tierB, 60_000);
  setInterval(tierBSlow, 300_000);
  setInterval(renderVerdict, 5_000); // freshness clock ticks even when nothing fetches
}
